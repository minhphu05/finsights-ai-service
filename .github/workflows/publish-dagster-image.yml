name: Publish Dagster AI pipelines

on:
  push:
    branches: [main]
    paths:
      - "app/ingestion/**"
      - "app/integrations/embeddings/**"
      - "app/rag/chunking/news_backfill.py"
      - "app/storage/mysql/engine.py"
      - "app/storage/postgres/**"
      - "orchestration/**"
      - "certs/mysql-node-2-ca.pem"
      - "deploy/dagster-requirements.txt"
      - "Dockerfile.dagster"
      - ".github/workflows/publish-dagster-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: finsights-ai-dagster-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/minhphu05/finsights-ai-service
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dagster
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
